# This is a CI/CD workflow triggered by push to release branch or manually
#
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                          開發流程範例 (Git Flow)                             ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║                                                                            ║
# ║  步驟 1：從 develop 建立 feature 分支進行開發                                ║
# ║    $ git checkout develop                                                  ║
# ║    $ git checkout -b feature/add-user-api                                  ║
# ║    $ # ... 撰寫程式碼 ...                                                  ║
# ║    $ git add . && git commit -m "feat: add user API"                       ║
# ║    $ git push origin feature/add-user-api                                  ║
# ║                                                                            ║
# ║  步驟 2：建立 PR 從 feature → develop，進行 Code Review                     ║
# ║    - 在 GitHub 上建立 Pull Request: feature/add-user-api → develop          ║
# ║    - 團隊成員審查程式碼、留下 Review 意見                                     ║
# ║    - 審查通過後合併 PR                                                      ║
# ║                                                                            ║
# ║  步驟 3：準備發佈，建立 PR 從 develop → release                              ║
# ║    - 在 GitHub 上建立 Pull Request: develop → release                       ║
# ║    - 確認所有功能已就緒、版本號已更新                                         ║
# ║    - 合併 PR → 觸發此 CI Workflow（push 事件）                               ║
# ║                                                                            ║
# ║  步驟 4：CI Pipeline 自動執行（本 Workflow）                                 ║
# ║    build → deliver → test → security-scan → oss-scan                       ║
# ║    - 建置 → 交付驗證 → 單元測試 → 安全掃描 → 開源授權檢測                     ║
# ║    - 全部通過後，程式碼品質已獲保證                                           ║
# ║                                                                            ║
# ║  步驟 5：正式發佈，建立 PR 從 release → main                                ║
# ║    - 在 GitHub 上建立 Pull Request: release → main                          ║
# ║    - 最終確認後合併，並在 main 上打版本標籤                                   ║
# ║    $ git tag v1.0.0 && git push origin v1.0.0                              ║
# ║                                                                            ║
# ║  分支結構圖：                                                               ║
# ║                                                                            ║
# ║  feature/* ──PR──→ develop ──PR──→ release ──PR──→ main                    ║
# ║                                      ↑                  ↑                  ║
# ║                                CI 在此觸發          打 tag 發佈             ║
# ║                                                                            ║
# ║  緊急修復：可透過 workflow_dispatch 手動觸發 CI，不需經過完整 PR 流程          ║
# ║                                                                            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                          Pipeline 治理規範                                  ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║ 1. 僅限開源工具：所有使用的 Action 與 CLI 工具必須為 OSI 認可的開源授權       ║
# ║    （MIT / Apache 2.0 / BSD），禁止使用閉源或僅提供免費試用的商業工具。        ║
# ║ 2. 無商業授權爭議：不採用授權條款模糊、有雙重授權爭議或近期變更授權模式         ║
# ║    （如由開源轉為 BSL/SSPL/BUSL）的工具。                                   ║
# ║ 3. 費用控管：所有 Job 僅使用 GitHub-hosted ubuntu-latest Runner              ║
# ║    （公開倉庫免費，私有倉庫消耗免費額度），不使用付費的 larger runner            ║
# ║    或第三方 SaaS 服務。                                                     ║
# ║ 4. 資料不外流：所有掃描與分析皆在 Runner 本機執行，不將原始碼、掃描結果         ║
# ║    或建置產物上傳至 GitHub 以外的第三方服務。唯一的例外是 govulncheck           ║
# ║    會查詢 Go 官方漏洞資料庫 (vuln.go.dev)，僅傳送 module path，不傳送原始碼。  ║
# ║ 5. 第三方金鑰：目前此 pipeline 不需要任何第三方服務金鑰。若未來新增需要          ║
# ║    金鑰的步驟，必須在 workflow_dispatch inputs 中明確宣告，讓使用者知悉。       ║
# ║ 6. 供應鏈安全：所有第三方 Action 必須鎖定版本標籤（如 @v4），禁止使用           ║
# ║    @master 或 @main 等浮動分支，防止供應鏈攻擊。                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 工具授權清單：
#   - actions/checkout@v6           → MIT License (GitHub 官方, Node 24)
#   - actions/setup-go@v6           → MIT License (GitHub 官方, Node 24)
#   - actions/upload-artifact@v7    → MIT License (GitHub 官方, Node 24)
#   - actions/download-artifact@v7  → MIT License (GitHub 官方, Node 24)
#   - gosec (go install)            → Apache License 2.0
#   - govulncheck                   → BSD-3-Clause (Go 官方)
#   - go-licenses                   → Apache License 2.0 (Google)
#
# 資料流向說明：
#   - 原始碼：僅存在於 GitHub Runner 本機，不傳送至外部
#   - 建置產物：透過 GitHub Artifact 暫存，僅限同 Workflow 內的 Job 存取
#   - 掃描結果：僅輸出至 Actions 日誌與 Artifact，不外傳
#   - govulncheck：僅向 vuln.go.dev 傳送 module path 比對漏洞，不傳送原始碼

name: CI Pipeline

# 觸發條件：
# 1. push to release — PR 合併到 release 分支時自動觸發（標準開發流程）
# 2. workflow_dispatch — 保留手動觸發彈性（緊急修復、測試 pipeline）
on:
  push:
    branches:
      - release
      - master
      - develop

  workflow_dispatch:
    # 手動觸發時可接受的輸入參數
    inputs:
      name:
        description: 'Person to greet'
        default: 'World'
        required: true
        type: string
      # ──────────────────────────────────────
      # 第三方金鑰區塊（目前無需金鑰）
      # 若未來整合需要 API Key 的服務，請在此區塊新增 input，
      # 並搭配 GitHub Secrets 使用，切勿將金鑰硬編碼於 workflow 中。
      # 範例：
      # snyk_token:
      #   description: 'Snyk API Token（若啟用 Snyk 掃描才需要）'
      #   required: false
      #   type: string
      # ──────────────────────────────────────

# 最小權限原則：僅授予此 workflow 實際需要的權限，
# 避免 GITHUB_TOKEN 被濫用或在供應鏈攻擊中造成更大損害。
permissions:
  contents: read        # 僅需讀取倉庫原始碼
  actions: read         # 讀取 workflow 狀態

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
# 每個 Job 都運行在獨立的虛擬機器中，彼此不共享檔案系統，
# 因此每個需要原始碼的 Job 都必須重新 checkout。
# 執行順序: build → deliver → test → security-scan → oss-scan
#
# 費用說明：所有 Job 使用 ubuntu-latest（GitHub-hosted），
# 公開倉庫完全免費；私有倉庫每月有 2,000 分鐘免費額度（Free plan）。
# 本 pipeline 單次執行預估耗時 < 10 分鐘，不會產生額外費用。
jobs:

  # ──────────────────────────────────────
  # 1. Golang 建置 (Build)
  # ──────────────────────────────────────
  build:
    runs-on: ubuntu-latest    # 免費 Runner，不使用付費 larger runner
    steps:
      # actions/checkout@v6（MIT License, GitHub 官方維護，Node 24）
      # 將 Git 倉庫的原始碼拉取到 Runner 的工作目錄中。
      # Runner 預設是乾淨的虛擬環境，不包含任何專案檔案。
      # 資料安全：原始碼僅存在於 Runner 本機，不會傳送至外部。
      - name: Checkout code
        uses: actions/checkout@v6

      # actions/setup-go@v6（MIT License, GitHub 官方維護，Node 24）
      # 安裝指定版本的 Go 編譯器並設定 GOPATH / GOROOT 環境變數。
      # 資料安全：僅從 golang.org 官方下載 Go SDK，不傳送任何專案資料。
      # cache: false — 本專案無外部相依（無 go.sum），關閉快取避免警告。
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      # go build：Go 官方內建工具（BSD-3-Clause），完全本機執行。
      # -o demo-app 指定輸出檔名，./... 表示遞迴編譯所有子套件。
      - name: Build
        run: go build -ldflags="-w -s" -o demo-app ./...

      # actions/upload-artifact@v4（MIT License, GitHub 官方維護）
      # 將建置產物上傳至 GitHub Actions 的暫存區（非第三方服務），
      # 僅限同 Workflow 內的 Job 透過 download-artifact 存取。
      # 資料安全：產物儲存在 GitHub 基礎設施內，不外流至第三方。
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: demo-app
          path: demo-app

  # ──────────────────────────────────────
  # 2. 交付執行檔 (Deliver Artifact)
  # ──────────────────────────────────────
  deliver:
    runs-on: ubuntu-latest    # 免費 Runner
    # needs: build 表示此 Job 必須等 build Job 成功完成後才會執行，
    # 確保建置產物已經準備好可供下載。
    needs: build
    steps:
      # actions/download-artifact@v7（MIT License, GitHub 官方維護，Node 24）
      # 從 GitHub Actions 暫存區下載先前上傳的建置產物，
      # 這是跨 Job 傳遞檔案的標準方式。
      # 資料安全：僅從 GitHub 內部暫存區下載，不涉及第三方服務。
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: demo-app

      # 驗證下載的執行檔是否完整且為有效的 ELF 二進位檔案：
      # - ls -la：確認檔案存在及大小
      # - file：檢查檔案類型（應為 ELF 64-bit executable）
      # - chmod +x：賦予執行權限，確保檔案可被執行
      - name: Verify executable
        run: |
          ls -la demo-app
          file demo-app
          chmod +x demo-app
          echo "Artifact delivered and verified successfully."

  # ──────────────────────────────────────
  # 3. 單元測試 (Unit Test)
  # ──────────────────────────────────────
  test:
    runs-on: ubuntu-latest    # 免費 Runner
    # 在交付驗證通過後才執行測試，確保建置產物已驗證完畢。
    needs: deliver
    steps:
      # 測試需要原始碼，因此必須重新 checkout（不同 Job = 不同 Runner = 乾淨環境）。
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      # go test：Go 官方內建測試工具（BSD-3-Clause），完全本機執行。
      # -v：顯示每個測試函式的詳細結果（PASS/FAIL）
      # -race：啟用 Go 內建的 race detector，偵測並發競爭條件
      # -coverprofile=coverage.out：產出測試覆蓋率報告檔案
      # ./...：遞迴測試所有子套件
      # 資料安全：測試完全在本機執行，結果僅輸出至 Actions 日誌。
      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out ./...

      # 上傳覆蓋率報告至 GitHub Artifact（非第三方服務如 Codecov），
      # 避免原始碼或覆蓋率資料外流至外部平台。
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out

  # ──────────────────────────────────────
  # 4. 安全檢測 (Security Scan)
  # ──────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest    # 免費 Runner
    # 在單元測試通過後才進行安全掃描，避免對有錯誤的程式碼浪費掃描資源。
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      # gosec (Go Security Checker)（Apache License 2.0，純開源無商業爭議）
      # 靜態分析工具，掃描原始碼中常見的安全漏洞，
      # 包括 SQL injection、硬編碼密碼、不安全的隨機數、弱加密演算法等。
      # 資料安全：透過 go install 安裝後完全在本機執行，不依賴第三方 Action。
      # -fmt=json：以 JSON 格式輸出掃描結果，方便後續解析與存檔。
      # -stdout：將結果輸出至 stdout（搭配重導向存檔）。
      # -no-fail：不因發現問題而回傳非零退出碼，確保 pipeline 不中斷。
      # 掃描結果以報告形式上傳至 Artifact，供團隊審查後決定修復優先順序。
      - name: Run gosec security scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt=json -stdout -no-fail ./... | tee gosec-report.json
          echo "--- gosec 掃描完成，結果已輸出至 gosec-report.json ---"

      - name: Upload gosec report
        uses: actions/upload-artifact@v7
        with:
          name: gosec-report
          path: gosec-report.json

      # govulncheck（BSD-3-Clause，Go 官方維護，無商業授權爭議）
      # 比對專案引用的相依套件是否存在已知的 CVE 漏洞（基於 Go 漏洞資料庫）。
      # 資料安全：僅向 vuln.go.dev（Go 官方）傳送 module path 進行比對，
      # 不傳送原始碼或任何敏感資訊。無需 API Key。
      # -json：以 JSON 格式輸出，與 gosec 報告格式統一，方便後續解析。
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -json ./... | tee govulncheck-report.json || true
          echo "--- govulncheck 掃描完成，結果已輸出至 govulncheck-report.json ---"

      - name: Upload govulncheck report
        uses: actions/upload-artifact@v7
        with:
          name: govulncheck-report
          path: govulncheck-report.json

  # ──────────────────────────────────────
  # 5. 開源檢測 (Open Source / License Scan)
  # ──────────────────────────────────────
  oss-scan:
    runs-on: ubuntu-latest    # 免費 Runner
    # 在安全掃描通過後才進行開源授權檢測，確保程式碼本身安全無虞。
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      # go-licenses（Apache License 2.0，Google 開發，純開源無商業爭議）
      # 檢查專案所有直接與間接相依套件的授權類型。
      # 資料安全：完全在本機執行，僅讀取本機的 Go module cache，不上傳資料。
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      # check 子命令：驗證第三方相依套件的授權是否符合規範。
      # --ignore=demo ：排除專案本身的 module，僅掃描第三方套件。
      #   原因：go-licenses 預設會掃描專案自己的授權，但專案未必有 LICENSE 檔案，
      #   而開源檢測的目的是確認「引用的第三方套件」授權合規，不是檢查自己。
      # --disallowed_types：若發現 GPL 等 copyleft / 限制性授權，回傳非零退出碼中斷 pipeline，
      #   確保專案不會引入有商業爭議的授權套件。
      - name: Check licenses
        run: go-licenses check --ignore=demo ./...

      # report 子命令：產出完整的第三方套件授權清單報告，
      # 列出每個相依套件的名稱、授權類型及授權檔案路徑，
      # 方便法務或合規團隊審查。
      # --ignore=demo ：同樣排除專案本身，僅列出第三方套件。
      # 資料安全：報告僅存於 Runner 本機並上傳至 GitHub Artifact，不外傳。
      - name: Generate license report
        run: |
          go-licenses report --ignore=demo ./... 2>/dev/null > license-report.txt || true
          cat license-report.txt

      # 上傳授權報告作為 pipeline 產物，方便下載留存或供後續審計使用。
      - name: Upload license report
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: license-report.txt
